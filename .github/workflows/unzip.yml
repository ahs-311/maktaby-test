
name: Extract ZIP File

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Extract ZIP archive
        run: |
          if [ ! -f "maktaby1-ux-branch.zip" ]; then
            echo "ERROR: ZIP file not found in repository root"
            exit 1
          fi

          mkdir -p extracted
          unzip -o "maktaby1-ux-branch.zip" -d extracted

      - name: Save extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extracted
          git commit -m "Extract maktaby1-ux-branch ZIP" || exit 0
          git push
