
name: Extract Project ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract project
        run: |
          set -eu

          ZIP="maktaby1-ux-branch.zip"

          test -f "$ZIP" || {
            echo "ERROR: ZIP file not found"
            exit 1
          }

          unzip -t "$ZIP"

          mkdir -p extracted
          unzip -o "$ZIP" -d extracted

          echo "Extracted files:"
          find extracted -type f | wc -l

          echo "Project files:"
          find extracted -maxdepth 2 -type f | head -50

      - name: Publish extracted files to repository
        run: |
          set -eu

          # Copy extracted files into the repository root.
          # Preserve the original ZIP and workflow.
          cp -a extracted/. .

          rm -rf extracted

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi

          git commit -m "Extract project files into repository"
          git push
